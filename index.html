<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0d0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-title" content="75 Focused" />
<link rel="manifest" href="manifest.webmanifest" />
<title>75 Focused</title>
<style>
:root{--bg:#090b0d;--surface:#111418;--surface2:#171b20;--ink:#f7f7f5;--muted:#9299a1;--orange:#ff7a00;--orange2:#ff9a1f;--line:#292e34;--success:#ff6a00}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -15%,#282018 0,#111316 28%,#090b0d 58%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:540px;margin:0 auto;min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 17px calc(96px + env(safe-area-inset-bottom))}
.brand{text-align:left;margin:5px 3px 21px}.brand h1{font-size:38px;line-height:.95;letter-spacing:-.035em;margin:0;font-weight:950;font-style:italic}.brand h1::first-letter{color:var(--orange)}.brand p{margin:9px 0 0;color:#b0b5bb;font-size:13px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#1a1e23,#101317);border:1px solid #2b3036;color:white;border-radius:23px;padding:21px 20px 19px;margin-bottom:13px;box-shadow:0 16px 40px rgba(0,0,0,.3)}.hero:before{content:'75';position:absolute;right:-9px;top:-28px;font-size:116px;font-weight:950;font-style:italic;color:rgba(255,122,0,.075);letter-spacing:-.08em}.hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.day{font-size:23px;font-weight:900;letter-spacing:-.02em}.date{font-size:12.5px;color:#aeb4bb;margin-top:4px;font-weight:600}.score{font-size:24px;font-weight:950;white-space:nowrap;color:var(--orange)}.bar{position:relative;height:7px;background:#2a2e33;border-radius:99px;margin-top:17px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:99px;width:0;transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 15px rgba(255,122,0,.45)}
.card{background:rgba(17,20,24,.96);border:1px solid var(--line);border-radius:21px;padding:3px 15px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.goal{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid #262a2f;cursor:pointer;transition:transform .12s,opacity .2s}.goal:active{transform:scale(.985)}.goal:last-child{border-bottom:0}.check{width:29px;height:29px;border:2px solid #555d66;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;transition:.18s}.goal.done .check{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,0,.11)}.goal.done .check:after{content:'✓';color:#111;font-size:18px;font-weight:950}.goal.done .goal-title{color:#8c9299}.goal-title{font-weight:800;font-size:16px;letter-spacing:-.01em}.goal-sub{font-size:12.5px;color:#818891;margin-top:3px;line-height:1.35}.social-option{margin:0 0 13px 45px;padding:12px 13px;border:1px solid #3a4148;border-radius:13px;background:#171b20;color:#c8cdd2;font-size:12.5px;font-weight:700;line-height:1.35;cursor:pointer}.social-option.selected{border-color:var(--orange);color:var(--orange);background:rgba(255,122,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.stat{background:linear-gradient(145deg,#15191d,#101317);border:1px solid var(--line);border-radius:17px;padding:15px 14px}.stat strong{display:block;font-size:23px;color:var(--orange);font-weight:950;letter-spacing:-.035em}.stat span{font-size:10.5px;color:#969da5;font-weight:800;text-transform:uppercase;letter-spacing:.055em}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);display:grid;grid-template-columns:1fr 1fr;background:rgba(11,13,15,.92);backdrop-filter:blur(18px);border-top:1px solid #262b30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;padding:11px;font:inherit;color:#777f87;font-weight:800}.nav button.active{color:var(--orange)}
.hidden{display:none}.history-head{display:flex;justify-content:space-between;align-items:center;margin:5px 1px 13px}.history-head h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}.history-list{display:flex;flex-direction:column;gap:8px}.history-day{background:#111418;border:1px solid var(--line);border-radius:15px;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.history-day .left strong{display:block;font-weight:850}.history-day .left span{font-size:12px;color:#858c94}.badge{font-weight:900}.perfect{color:var(--orange)}.future{opacity:.45}.back{border:1px solid #333940;background:#171b20;color:var(--orange);border-radius:10px;padding:8px 11px;font-weight:800}.note{text-align:center;color:#6f767e;font-size:11.5px;margin-top:14px;line-height:1.4}
@media (prefers-reduced-motion:no-preference){.goal.done .check{animation:pop .22s ease-out}@keyframes pop{50%{transform:scale(1.13)}}}
</style>
</head>
<body><main class="app">
<section class="brand"><h1>75 FOCUSED</h1><p>75 Days. 7 Daily Commitments.</p></section>
<section id="todayView">
  <div class="hero"><div class="hero-top"><div><div class="day" id="dayLabel"></div><div class="date" id="dateLabel"></div></div><div class="score" id="scoreLabel">0 / 7</div></div><div class="bar"><div id="dayBar"></div></div></div>
  <div class="card" id="goals"></div>
  <div class="stats"><div class="stat"><strong id="streak">0</strong><span>Perfect-Day Streak</span></div><div class="stat"><strong id="perfectDays">0 / 75</strong><span>Perfect Days</span></div><div class="stat"><strong id="overall">0%</strong><span>Overall Completion</span></div><div class="stat"><strong id="challengeProgress">0%</strong><span>Challenge Progress</span></div></div>
  <div class="note">Your progress is stored on this device. You can edit prior days from History.</div>
</section>
<section id="historyView" class="hidden"><div class="history-head"><h2>75-Day History</h2><button class="back hidden" id="backToday">Today</button></div><div class="history-list" id="history"></div></section>
</main>
<nav class="nav"><button id="todayTab" class="active">Today</button><button id="historyTab">History</button></nav>
<script>
const START=new Date(2026,9,1); const DAYS=75;
const goals=[
 {t:'Drink 100 oz. Water'},
 {t:'Walk 10,000 Steps'},
 {t:'Read 10 Pages',s:'Bible or book'},
 {t:'Pray'},
 {t:'Journal',s:'Daily Self-Reflection'},
 {t:'No Alcohol',alcohol:true},
 {t:'No Pornography'}
];
const key='75focused-v1'; let data=JSON.parse(localStorage.getItem(key)||'{}'); let selectedIndex=currentIndex();
function currentIndex(){let n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.floor((n-START)/86400000)}
function dateFor(i){let d=new Date(START);d.setDate(d.getDate()+i);return d}
function k(i){return String(i+1)} function arr(i){let a=data[k(i)]||Array(7).fill(false); if(!Array.isArray(a)) a=Array(7).fill(false); return a} function alcoholMode(i){return (data['alcohol-'+k(i)]||'none')} function goalDone(i,j){if(j===5)return arr(i)[5]||alcoholMode(i)==='social';return !!arr(i)[j]} function countDone(i){let n=0;for(let j=0;j<7;j++)if(goalDone(i,j))n++;return n}
function save(){localStorage.setItem(key,JSON.stringify(data))}
function fmt(d){return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function renderDay(i){selectedIndex=Math.max(0,Math.min(DAYS-1,i));let a=arr(selectedIndex),count=countDone(selectedIndex),d=dateFor(selectedIndex);document.getElementById('dayLabel').textContent=`DAY ${selectedIndex+1} OF 75`;document.getElementById('dateLabel').textContent=fmt(d);document.getElementById('scoreLabel').textContent=`${count} / 7`;document.getElementById('dayBar').style.width=(count/7*100)+'%';
 let box=document.getElementById('goals');box.innerHTML='';goals.forEach((g,j)=>{let done=goalDone(selectedIndex,j),el=document.createElement('div');el.className='goal'+(done?' done':'');el.innerHTML=`<div class="check"></div><div><div class="goal-title">${g.t}</div>${g.s?`<div class="goal-sub">${g.s}</div>`:''}</div>`;el.onclick=()=>{let x=arr(selectedIndex).slice();if(j===5){x[5]=!x[5];data['alcohol-'+k(selectedIndex)]='none'}else{x[j]=!x[j]}data[k(selectedIndex)]=x;save();renderDay(selectedIndex)};box.appendChild(el);if(j===5&&!a[5]){let opt=document.createElement('div'),sel=alcoholMode(selectedIndex)==='social';opt.className='social-option'+(sel?' selected':'');opt.textContent=(sel?'✓ ':'')+'Maximum two standard drinks per day if in social setting.';opt.onclick=()=>{data['alcohol-'+k(selectedIndex)]=sel?'none':'social';save();renderDay(selectedIndex)};box.appendChild(opt)}});renderStats();document.getElementById('backToday').classList.toggle('hidden',selectedIndex===Math.max(0,Math.min(DAYS-1,currentIndex())))}
function renderStats(){let ci=Math.max(-1,Math.min(DAYS-1,currentIndex()));let completed=0,perfect=0;for(let i=0;i<=Math.max(ci,0);i++){let c=countDone(i);completed+=c;if(c===7)perfect++}let streak=0;for(let i=ci;i>=0;i--){if(countDone(i)===7)streak++;else break}let elapsed=Math.max(0,Math.min(DAYS,ci+1));document.getElementById('streak').textContent=streak;document.getElementById('perfectDays').textContent=`${perfect} / 75`;document.getElementById('overall').textContent=elapsed?Math.round(completed/(elapsed*7)*100)+'%':'0%';document.getElementById('challengeProgress').textContent=Math.round(elapsed/DAYS*100)+'%'}
function renderHistory(){let h=document.getElementById('history');h.innerHTML='';let ci=currentIndex();for(let i=0;i<DAYS;i++){let c=countDone(i),d=dateFor(i),el=document.createElement('div');el.className='history-day'+(i>ci?' future':'');el.innerHTML=`<div class="left"><strong>Day ${i+1}</strong><span>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div><div class="badge ${c===7?'perfect':''}">${i>ci?'Upcoming':c+'/7'+(c===7?' ✓':'')}</div>`;if(i<=ci)el.onclick=()=>{showToday();renderDay(i)};h.appendChild(el)}}
function showToday(){document.getElementById('todayView').classList.remove('hidden');document.getElementById('historyView').classList.add('hidden');document.getElementById('todayTab').classList.add('active');document.getElementById('historyTab').classList.remove('active')}
function showHistory(){document.getElementById('todayView').classList.add('hidden');document.getElementById('historyView').classList.remove('hidden');document.getElementById('todayTab').classList.remove('active');document.getElementById('historyTab').classList.add('active');renderHistory()}
document.getElementById('todayTab').onclick=()=>{showToday();renderDay(Math.max(0,Math.min(DAYS-1,currentIndex())))};document.getElementById('historyTab').onclick=showHistory;document.getElementById('backToday').onclick=()=>renderDay(Math.max(0,Math.min(DAYS-1,currentIndex())));
renderDay(Math.max(0,Math.min(DAYS-1,currentIndex())));
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
