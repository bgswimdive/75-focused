<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f1e8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="75 Focused" />
<link rel="manifest" href="manifest.webmanifest" />
<title>75 Focused</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#18241f;--muted:#6c746f;--accent:#234b3b;--line:#ddd8cc;--soft:#e7eee9;--danger:#8b4a3f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:540px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin:4px 0 18px}.brand h1{font-size:31px;letter-spacing:.08em;margin:0;font-weight:800}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:600}
.hero{background:var(--accent);color:white;border-radius:22px;padding:19px 20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(24,36,31,.08)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.day{font-size:24px;font-weight:800}.date{font-size:13px;opacity:.8;margin-top:2px}.score{font-size:22px;font-weight:800;white-space:nowrap}.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:15px;overflow:hidden}.bar>div{height:100%;background:white;border-radius:99px;width:0;transition:.25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px;box-shadow:0 4px 18px rgba(24,36,31,.04)}
.goal{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.goal:last-child{border-bottom:0}.check{width:27px;height:27px;border:2px solid #9aa19d;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;transition:.15s}.goal.done .check{background:var(--accent);border-color:var(--accent)}.goal.done .check:after{content:'✓';color:white;font-size:18px;font-weight:800}.goal.done .goal-title{text-decoration:line-through;color:#7c827f}.goal-title{font-weight:750;font-size:16px}.goal-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted);font-weight:650}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);display:grid;grid-template-columns:1fr 1fr;background:rgba(255,253,248,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;padding:10px;font:inherit;color:var(--muted);font-weight:750}.nav button.active{color:var(--accent)}
.hidden{display:none}.history-head{display:flex;justify-content:space-between;align-items:center;margin:5px 0 12px}.history-head h2{margin:0;font-size:22px}.history-list{display:flex;flex-direction:column;gap:8px}.history-day{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.history-day .left strong{display:block}.history-day .left span{font-size:12px;color:var(--muted)}.badge{font-weight:800}.perfect{color:var(--accent)}.future{opacity:.55}.back{border:0;background:var(--soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-weight:750}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;line-height:1.4}
</style>
</head>
<body><main class="app">
<section class="brand"><h1>75 FOCUSED</h1><p>75 Days. 7 Daily Commitments.</p></section>
<section id="todayView">
  <div class="hero"><div class="hero-top"><div><div class="day" id="dayLabel"></div><div class="date" id="dateLabel"></div></div><div class="score" id="scoreLabel">0 / 7</div></div><div class="bar"><div id="dayBar"></div></div></div>
  <div class="card" id="goals"></div>
  <div class="stats"><div class="stat"><strong id="streak">0</strong><span>Perfect-Day Streak</span></div><div class="stat"><strong id="perfectDays">0 / 75</strong><span>Perfect Days</span></div><div class="stat"><strong id="overall">0%</strong><span>Overall Completion</span></div><div class="stat"><strong id="challengeProgress">0%</strong><span>Challenge Progress</span></div></div>
  <div class="note">Your progress is stored on this device. You can edit prior days from History.</div>
</section>
<section id="historyView" class="hidden"><div class="history-head"><h2>75-Day History</h2><button class="back hidden" id="backToday">Today</button></div><div class="history-list" id="history"></div></section>
</main>
<nav class="nav"><button id="todayTab" class="active">Today</button><button id="historyTab">History</button></nav>
<script>
const START=new Date(2026,9,1); const DAYS=75;
const goals=[
 {t:'Drink 100 oz. Water'},
 {t:'Walk 10,000 Steps'},
 {t:'Read 10 Pages',s:'Bible or book'},
 {t:'Pray'},
 {t:'Journal',s:'Daily Self-Reflection'},
 {t:'Alcohol Goal',s:'No alcohol; maximum 2 standard drinks if in a social setting'},
 {t:'No Pornography'}
];
const key='75focused-v1'; let data=JSON.parse(localStorage.getItem(key)||'{}'); let selectedIndex=currentIndex();
function currentIndex(){let n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.floor((n-START)/86400000)}
function dateFor(i){let d=new Date(START);d.setDate(d.getDate()+i);return d}
function k(i){return String(i+1)} function arr(i){return data[k(i)]||Array(7).fill(false)}
function save(){localStorage.setItem(key,JSON.stringify(data))}
function fmt(d){return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function renderDay(i){selectedIndex=Math.max(0,Math.min(DAYS-1,i));let a=arr(selectedIndex),count=a.filter(Boolean).length,d=dateFor(selectedIndex);document.getElementById('dayLabel').textContent=`DAY ${selectedIndex+1} OF 75`;document.getElementById('dateLabel').textContent=fmt(d);document.getElementById('scoreLabel').textContent=`${count} / 7`;document.getElementById('dayBar').style.width=(count/7*100)+'%';
 let box=document.getElementById('goals');box.innerHTML='';goals.forEach((g,j)=>{let el=document.createElement('div');el.className='goal'+(a[j]?' done':'');el.innerHTML=`<div class="check"></div><div><div class="goal-title">${g.t}</div>${g.s?`<div class="goal-sub">${g.s}</div>`:''}</div>`;el.onclick=()=>{let x=arr(selectedIndex).slice();x[j]=!x[j];data[k(selectedIndex)]=x;save();renderDay(selectedIndex)};box.appendChild(el)});renderStats();document.getElementById('backToday').classList.toggle('hidden',selectedIndex===Math.max(0,Math.min(DAYS-1,currentIndex())))}
function renderStats(){let ci=Math.max(-1,Math.min(DAYS-1,currentIndex()));let completed=0,perfect=0;for(let i=0;i<=Math.max(ci,0);i++){let a=arr(i),c=a.filter(Boolean).length;completed+=c;if(c===7)perfect++}let streak=0;for(let i=ci;i>=0;i--){if(arr(i).filter(Boolean).length===7)streak++;else break}let elapsed=Math.max(0,Math.min(DAYS,ci+1));document.getElementById('streak').textContent=streak;document.getElementById('perfectDays').textContent=`${perfect} / 75`;document.getElementById('overall').textContent=elapsed?Math.round(completed/(elapsed*7)*100)+'%':'0%';document.getElementById('challengeProgress').textContent=Math.round(elapsed/DAYS*100)+'%'}
function renderHistory(){let h=document.getElementById('history');h.innerHTML='';let ci=currentIndex();for(let i=0;i<DAYS;i++){let a=arr(i),c=a.filter(Boolean).length,d=dateFor(i),el=document.createElement('div');el.className='history-day'+(i>ci?' future':'');el.innerHTML=`<div class="left"><strong>Day ${i+1}</strong><span>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div><div class="badge ${c===7?'perfect':''}">${i>ci?'Upcoming':c+'/7'+(c===7?' ✓':'')}</div>`;if(i<=ci)el.onclick=()=>{showToday();renderDay(i)};h.appendChild(el)}}
function showToday(){document.getElementById('todayView').classList.remove('hidden');document.getElementById('historyView').classList.add('hidden');document.getElementById('todayTab').classList.add('active');document.getElementById('historyTab').classList.remove('active')}
function showHistory(){document.getElementById('todayView').classList.add('hidden');document.getElementById('historyView').classList.remove('hidden');document.getElementById('todayTab').classList.remove('active');document.getElementById('historyTab').classList.add('active');renderHistory()}
document.getElementById('todayTab').onclick=()=>{showToday();renderDay(Math.max(0,Math.min(DAYS-1,currentIndex())))};document.getElementById('historyTab').onclick=showHistory;document.getElementById('backToday').onclick=()=>renderDay(Math.max(0,Math.min(DAYS-1,currentIndex())));
renderDay(Math.max(0,Math.min(DAYS-1,currentIndex())));
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
